services:
  claquete:
    build: .
    image: claquete:local
    pull_policy: build
    container_name: claquete
    restart: unless-stopped
    environment:
      TZ: Europe/Lisbon
      # Endereço do site, sem / no fim (ex.: http://192.168.0.47:8085). Usado nos links dos emails.
      BASE_URL: ${BASE_URL:-}
      # Opcional: se definido, só regista quem souber o código.
      INVITE_CODE: ${INVITE_CODE:-}
      # Opcional: este utilizador passa a administrador (o primeiro registo já é admin).
      ADMIN_USER: ${ADMIN_USER:-}
      # Email (Gmail só para envio). Define estas duas no Portainer, nunca aqui no GitHub.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8085:8000"
    volumes:
      - claquete_data:/data
    networks:
      - networkpi
    security_opt:
      - no-new-privileges:true

volumes:
  claquete_data:

networks:
  networkpi:
    external: true
