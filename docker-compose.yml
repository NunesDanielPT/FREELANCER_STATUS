services:
  organizador:
    build: .
    container_name: organizador
    restart: unless-stopped
    environment:
      TZ: Europe/Lisbon
      RESET_USERS: ${RESET_USERS:-0}
    ports:
      - "8085:8000"
    volumes:
      - organizador_data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  organizador_data:
